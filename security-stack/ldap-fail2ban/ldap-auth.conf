# OpenLDAP (osixia, olcLogFile) filter for Fail2Ban.
#
# Goal: ban a source IP that makes repeated FAILED binds (err=49), without ever
# counting successful binds (err=0).
#
# In the slapd stats log the client IP appears on the ACCEPT line, while the
# failure appears on a later RESULT line of the SAME connection. They are tied
# only by `conn=<id>`, so this is a multiline filter that captures <HOST> from
# the ACCEPT line and requires an err=49 RESULT for that same conn id. The
# backreference keeps it correct even if connections interleave.
[Definition]
failregex = conn=(?P<cid>\d+) fd=\d+ ACCEPT from IP=<HOST>:\d+ \(IP=[^)]*\)(?:\n.*)*?\sconn=(?P=cid) op=\d+ RESULT tag=97 err=49\b
ignoreregex =

[Init]
maxlines = 30
